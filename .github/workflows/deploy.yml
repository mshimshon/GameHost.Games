name: Release

on:
  workflow_run:
    workflows: ["Build"] # 👈 Put the EXACT name of your build workflow here
    types:
      - completed
  workflow_dispatch: # Keeps your manual trigger working

concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installing Deploy It Smart
        run: |
          dotnet tool install -g DeployItSmart

      - name: Get Last Version Tag
        id: get_last_version
        shell: bash
        run: |
          # 1. Run the command and capture the text output
          OUTPUT=$(depitsmart GetCurrentReleaseVersionRunner) || EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          LATEST_TAG=$(echo "$OUTPUT" | tr -d '\r' | tail -n 1 | xargs)
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate Version
        id: get_version
        shell: bash
        run: |
          OUTPUT=$(depitsmart CalculateNextReleaseVersionRunner) || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "Log: Successfully generated version number -> '$OUTPUT'"
          echo "version=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: generate_release_notes
        shell: bash
        run: |
          LATEST_TAG="${{ steps.get_last_version.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          OUTPUT="/tmp/output/changelogs"
          mkdir -p "$OUTPUT"
          depitsmart GenerateChangeLogRunner -output "$OUTPUT" -linkCommits
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

          CHANGELOG_FILE="$OUTPUT/_.md"

          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::Required file _.md was not found in $OUTPUT"
            exit 1
          elif [ ! -s "$CHANGELOG_FILE" ]; then
            echo "::error::The changelog file _.md exists but it is completely empty!"
            exit 1
          fi

      - name: Publish New Releases
        shell: bash
        run: |
          set -eu
          VERSION="${{ steps.get_version.outputs.version }}"

          mkdir -p "/tmp/output/consoles"

          # Ensure target directory exists before searching
          if [ ! -d "src/Setup" ]; then
            echo "Directory src/Setup does not exist"
            exit 1
          fi

          # Find all .csproj files exactly inside src/Setup/SUBFOLDER/
          # (maxdepth 2 ensures we look in the immediate subfolders of src/Setup)
          find src/Setup -maxdepth 2 -mindepth 2 -name "*.csproj" | while read -r csproj; do

            # Extract filename without directory path (e.g., GameServer.csproj)
            filename=$(basename "$csproj")

            # Extract name without extension (e.g., GameServer)
            name="${filename%.csproj}"

            changelog_file="/tmp/artifacts/changelogs/${name}.md"

            # Check if matching changelog exists
            if [ ! -f "$changelog_file" ]; then
              echo "Skipping $name: Changelog not found at $changelog_file"
              continue
            fi

            echo "Publishing $name version $VERSION..."

            publish_dir="/tmp/publish_temp/$name"

            dotnet publish "$csproj" \
              -c Release \
              -r linux-x64 \
              --self-contained true \
              -o "$publish_dir" \
              -p:AssemblyVersion="$VERSION" \
              -p:FileVersion="$VERSION" \
              -p:InformationalVersion="$VERSION"

            archive_name="${name}.${VERSION}.tar.gz"
            # Note: Fixed target path to use the workspace output folder you created above
            tar -czf "/tmp/output/consoles/$archive_name" -C "$publish_dir" .
          done

      - name: Compiling Manifests
        shell: bash
        run: |
            set -eu

            # Ensure the output directory exists
            mkdir -p "/tmp/output/registry"

            # Check if target directory exists
            if [ ! -d "src/Setup" ]; then
              echo "::error::Directory src/Setup does not exist"
              exit 1
            fi

            manifestsArray="[]"
            found_manifests=false

            # Loop through all immediate subfolders of src/Setup
            for folder in src/Setup/*/; do
              [ -d "$folder" ] || continue

              manifest_path="${folder}config/manifest.json"

              if [ -f "$manifest_path" ]; then
                found_manifests=true
                # Use jq to safely append the JSON file contents into our array
                manifestsArray="$(jq --argjson new_item "$(cat "$manifest_path")" '. + [$new_item]' <<< "$manifestsArray")"
              else
                echo "::warning::manifest.json missing for subfolder $folder"
              fi
            done

            # Double-check that we actually gathered at least one manifest
            if [ "$found_manifests" = false ]; then
              echo "::error::NO MANIFESTS FOUND IN src/Setup/*"
              exit 1
            fi

            # Output the compiled array into the requested registry file
            echo "$manifestsArray" > "/tmp/output/registry/manifests.json"

      - name: Building Dependencies Registry
        shell: bash
        run: |
          set -eu
          commonFiles="$(find "$GITHUB_WORKSPACE" -name 'dep_*_*_common.json' | sort)"
          if [ -z "$commonFiles" ]; then
            echo "::error::NO COMMON DEPENDENCY FILES FOUND"
            exit 1
          fi
          mkdir -p "/tmp/output/registry"
          for file in $commonFiles; do
            cp "$file" "/tmp/output/registry/"
          done

      - name: Validating Release
        shell: bash
        run: |
            registry_dir="/tmp/output/registry"

            if [ ! -d "$registry_dir" ]; then
              echo "::error::Registry directory does not exist: $registry_dir"
              exit 1
            fi
            output_dir="/tmp/output/consoles"
            if [ ! -d "$output_dir" ]; then
              echo "::error::Console output directory does not exist: $output_dir"
              exit 1
            fi

            tarball_files="$(find "$output_dir" -name '*.tar.gz' | sort)"
            if [ -z "$tarball_files" ]; then
              echo "::error::No tar.gz files found in $output_dir"
              exit 1
            fi

      - name: Release Consoles
        shell: bash
        run: |
            set -eu
            version="${{ steps.get_version.outputs.version }}"
            output_dir="/tmp/output/consoles"
            tarball_files="$(find "$output_dir" -name '*.tar.gz' | sort)"
            for tarball in $tarball_files; do
              filename="$(basename "$tarball")"
              base_no_ext="${filename%.tar.gz}"
              name="${base_no_ext%.$version}"
              tag_name="${name}-v${version}"
              echo "Creating release $tag_name with file $filename..."
              gh release create "$tag_name" "$tarball" --title "$tag_name" --notes-file "/tmp/output/changelogs/${name}.md"
            done

      - name: Release Registry
        shell: bash
        run: |
            set -eu
            registry_dir="/tmp/output/registry"
            release_notes="/tmp/output/changelogs/_.md";
            version="${{ steps.get_version.outputs.version }}"
            tag_name="v${version}"
            echo "Creating release $tag_name and uploading registry contents..."
            # Uploads all files inside the registry folder as release assets
            gh release create "$tag_name" "$registry_dir"/* --title "$tag_name" --notes-file "$release_notes"
