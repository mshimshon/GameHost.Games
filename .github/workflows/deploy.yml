name: Release

on:
  workflow_run:
    workflows: ["Build"] # 👈 Put the EXACT name of your build workflow here
    types:
      - completed
  workflow_dispatch: # Keeps your manual trigger working

concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags 
      - name: Calculate Version
        id: get_version
        run: |
          set -eu
          # 1. Instantly fail if not inside a valid Git repository clone
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1) 
          echo "$LAST_TAG"
          if [ -z "$LAST_TAG" ]; then
            echo "First Release Detected"
            echo "version=0.0.100" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:%s) 
          PREV_VERSION=${LAST_TAG#v} 
          VERSION=$PREV_VERSION
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2) 
          PATCH=$(echo "$VERSION" | cut -d. -f3) 
          if echo "$COMMITS" | grep -iq '^trace:'; then
            echo "release=fasle" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$COMMITS" | grep -iq '^break:'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          elif echo "$COMMITS" | grep -iq '^feat:'; then
            MINOR=$((MINOR + 1))
            PATCH=0

          elif echo "$COMMITS" | grep -iq '^fix:'; then
            PATCH=$((PATCH + 1))

          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Error this is not a release... there are no fix:,break: or feat:. commits!"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Current Release $VERSION"
          echo "Next Release $NEW_VERSION"

          echo "previous_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        if: steps.get_version.outputs.release == 'true'
        id: generate_release_notes
        run: |
          set -eu
          LAST_VERSION="${{ steps.get_version.outputs.previous_version }}"
          NEXT_VERSION="${{ steps.get_version.outputs.version }}"
          COMMITS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%s) 

          
          mkdir -p /tmp/artifacts/output
          RELEASE_NOTES_FILE="/tmp/artifacts/output/release_notes.md"
          echo "" > "$RELEASE_NOTES_FILE"

          # 1. Extract Breaking Changes from FULL commit bodies (%B)
          BREAKS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^break:' | sed 's/^[Bb][Rr][Ee][Aa][Kk]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$BREAKS" ]; then
            echo "## BREAKING CHANGES" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$BREAKS" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 2. Extract Features from FULL commit bodies (%B)
          FEATS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^feat:' | sed 's/^[Ff][Ee][Aa][Tt]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FEATS" ]; then
            echo "## New Features" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$FEATS" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 3. Extract Fixes from FULL commit bodies (%B)
          FIXES=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^fix:' | sed 's/^[Ff][Ii][Xx]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FIXES" ]; then
            echo "## Fixes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$FIXES" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 4. Extract Notes from FULL commit bodies (%B)
          NOTES=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B | grep -Ei '^note:' | sed 's/^[Nn][Oo][Tt][Ee]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$NOTES" ]; then
            echo "## Notes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$NOTES" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi


          echo "notes_file=$RELEASE_NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        if: steps.get_version.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Discover Projects
        if: steps.get_version.outputs.release == 'true'
        id: project_discovery
        run: |
          allProjects="$(find "$GITHUB_WORKSPACE/src/Setup" -mindepth 2 -maxdepth 2 -name '*.csproj' | sort)"
          projectVersions=""
          projectVersionToRelease=""
          for csproj in $allProjects; do
            name="$(basename "$csproj" .csproj)"
            version="$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj" || true)"
            if [ -z "$version" ]; then
              echo "::error file=$csproj::Missing <Version>"
              exit 1
            fi
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error file=$csproj::Invalid version '$version'. Expected x.x.x"
                exit 1
            fi
            echo "$csproj -> $version"
            projectVersions+="${csproj};${version};${name} "
            if ! gh release view "${name}-v${version}" >/dev/null 2>&1; then
              projectVersionToRelease+="${csproj};${version};${name} "
            fi
          done
          echo "projectVersionToRelease=${projectVersionToRelease}" >> $GITHUB_OUTPUT
          echo "projectVersions=${projectVersions}" >> $GITHUB_OUTPUT
          echo "allProjects=${allProjects}" >> $GITHUB_OUTPUT

      - name: Validating Consoles
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          allProjects="${{ steps.project_discovery.outputs.allProjects }}"
          if [ -z "$allProjects" ]; then
            echo "::error::NO PROJECTS FOUND"
            exit 1
          fi
          for csproj in $allProjects; do
            root="$(dirname "$csproj")"

            [ -f "$root/assets/server_banner.jpg" ] || {
              echo "::error::/assets/server_banner.jpg must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/game_info.json" ] || {
              echo "::error::/config/game_info.json must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/manifest.json" ] || {
              echo "::error::/config/manifest.json must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/dependencies.json" ] || {
              echo "::error::/config/dependencies.json must be present for $csproj"
              exit 1
            }
          done

      - name: Publish New Releases
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          releases="${{ steps.project_discovery.outputs.projectVersionToRelease }}"

          if [ -z "$releases" ]; then
            echo "NO RELEASE FOUND"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output/consoles"
          for item in $releases; do
            set -- $(echo "$item" | tr ';' ' ')

            csproj="$1"
            version="$2"
            name="$3"

            echo "Publishing $name version $version..."

            publish_dir="$GITHUB_WORKSPACE/publish_temp/$name"
            dotnet publish "$csproj" -c Release -r linux-x64 --self-contained true -o "$publish_dir"

            archive_name="${name}.${version}.tar.gz"
            tar -czf "$GITHUB_WORKSPACE/output/consoles/$archive_name" -C "$publish_dir" .
          done

      - name: Compiling Manifests
        if: steps.get_version.outputs.release == 'true'
        run: |
            set -eu

            allProjects="${{ steps.project_discovery.outputs.allProjects }}"

            if [ -z "$allProjects" ]; then
              echo "::error::NO PROJECTS FOUND"
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/output/registry"

            manifestsArray="[]"

            for csproj in $allProjects; do
              root="$(dirname "$csproj")"
              manifest_path="$root/config/manifest.json"

              if [ ! -f "$manifest_path" ]; then
                echo "::error::manifest.json missing for $csproj"
                exit 1
              fi

              # Use jq to append each manifest object into a JSON array
              manifestsArray="$(jq --argjson new_item "$(cat "$manifest_path")" '. + [$new_item]' <<< "$manifestsArray")"
            done

            echo "$manifestsArray" > "$GITHUB_WORKSPACE/output/registry/manifests.json"

      - name: Building Dependencies Registry
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          commonFiles="$(find "$GITHUB_WORKSPACE" -name 'dep_*_*_common.json' | sort)"
          if [ -z "$commonFiles" ]; then
            echo "::error::NO COMMON DEPENDENCY FILES FOUND"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output/registry"
          for file in $commonFiles; do
            cp "$file" "$GITHUB_WORKSPACE/output/registry/"
          done

      - name: Validating Release
        if: steps.get_version.outputs.release == 'true'
        run: |
            registry_dir="$GITHUB_WORKSPACE/output/registry"

            if [ ! -d "$registry_dir" ]; then
              echo "::error::Registry directory does not exist: $registry_dir"
              exit 1
            fi
            output_dir="$GITHUB_WORKSPACE/output/consoles"
            if [ ! -d "$output_dir" ]; then
              echo "::error::Console output directory does not exist: $output_dir"
              exit 1
            fi

            tarball_files="$(find "$output_dir" -name '*.tar.gz' | sort)"
            if [ -z "$tarball_files" ]; then
              echo "::error::No tar.gz files found in $output_dir"
              exit 1
            fi
      - name: Release Consoles
        if: steps.get_version.outputs.release == 'true'
        run: |
            set -eu
            output_dir="$GITHUB_WORKSPACE/output/consoles"
            tarball_files="$(find "$output_dir" -name '*.tar.gz' | sort)"
            for tarball in $tarball_files; do
              filename="$(basename "$tarball")"

              base_no_ext="${filename%.tar.gz}"

              version="$(echo "$base_no_ext" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')"
              name="${base_no_ext%.$version}"

              tag_name="${name}-v${version}"
              echo "Creating release $tag_name with file $filename..."
              gh release create "$tag_name" "$tarball" --title "$tag_name" --notes "Release for $name version $version"
            done

      - name: Release Registry
        if: steps.get_version.outputs.release == 'true'
        run: |
            set -eu
            registry_dir="$GITHUB_WORKSPACE/output/registry"
            release_notes="${{ steps.generate_release_notes.outputs.notes_file }}";
            version="${{ steps.get_version.outputs.version }}"
            tag_name="registry-v${version}"
            echo "Creating release $tag_name and uploading registry contents..."
            # Uploads all files inside the registry folder as release assets
            gh release create "$tag_name" "$registry_dir"/* --title "$tag_name" --notes-file "$release_notes"