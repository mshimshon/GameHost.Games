name: Build

on:
  push:
    # branches:
    #   - main
  workflow_dispatch:

concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    if: >-
      !contains(github.event.head_commit.message, 'trace!') &&
      !contains(github.event.workflow_run.head_commit.message, 'trace!')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installing Deploy It Smart
        run: |
          dotnet tool install -g DeployItSmart

      - name: Get Last Version Tag
        id: get_last_version
        shell: bash
        run: |
          # 1. Run the command and capture the text output
          OUTPUT=$(depitsmart GetCurrentReleaseVersionRunner) || EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          LATEST_TAG=$(echo "$OUTPUT" | tr -d '\r' | tail -n 1 | xargs)
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate Version
        id: get_version
        shell: bash
        run: |
          OUTPUT=$(depitsmart CalculateNextReleaseVersionRunner) || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "Log: Successfully generated version number -> '$OUTPUT'"
          echo "version=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: generate_release_notes
        shell: bash
        run: |
          LATEST_TAG="${{ steps.get_last_version.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p "/tmp/artifacts/output"
          OUTPUT="/tmp/artifacts/output"
          depitsmart GenerateChangeLogRunner -output "$OUTPUT" -linkCommits
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

          CHANGELOG_FILE="$OUTPUT/_.md"

          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::Required file _.md was not found in $OUTPUT"
            exit 1
          elif [ ! -s "$CHANGELOG_FILE" ]; then
            echo "::error::The changelog file _.md exists but it is completely empty!"
            exit 1
          fi
          mv "$OUTPUT/_.md" "$OUTPUT/changelog.md"

      - name: Publish Projects
        shell: bash
        run: |
          allProjects="$(find "$GITHUB_WORKSPACE/src/Setup" -mindepth 2 -maxdepth 2 -name '*.csproj' | sort)"
          for csproj in $allProjects; do
            dotnet publish "$csproj" -c Release -r linux-x64 --self-contained true
          done
          echo "allProjects=${allProjects[*]}" >> $GITHUB_OUTPUT

      - name: Validating Consoles
        shell: bash
        run: |
          set -eu

          # Check if the target directory exists
          if [ ! -d "src/Setup" ]; then
            echo "::error::Directory src/Setup does not exist"
            exit 1
          fi

          # Loop through all immediate subdirectories in src/Setup
          for root in src/Setup/*/; do
            # Handle case where directory is empty
            [ -d "$root" ] || continue

            # Remove trailing slash for cleaner error messages
            root="${root%/}"

            [ -f "$root/assets/server_banner.jpg" ] || {
              echo "::error::$root/assets/server_banner.jpg must be present"
              exit 1
            }

            [ -f "$root/config/game_info.json" ] || {
              echo "::error::$root/config/game_info.json must be present"
              exit 1
            }

            [ -f "$root/config/manifest.json" ] || {
              echo "::error::$root/config/manifest.json must be present"
              exit 1
            }

            [ -f "$root/config/dependencies.json" ] || {
              echo "::error::$root/config/dependencies.json must be present"
              exit 1
            }
          done
