name: Build

on:
  push:
    # branches:
    #   - main
  workflow_dispatch:

concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags

      - name: Calculate Version
        id: get_version
        run: |
          set -eu
          echo "[DEBUG] Starting Calculate Version script..."

          # 1. Instantly fail if not inside a valid Git repository clone
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
          echo "[DEBUG] Confirmed inside a valid Git repository work tree."

          HEAD_COMMIT=$(git log -1 --pretty=format:%s)
          echo "[DEBUG] HEAD_COMMIT: \"$HEAD_COMMIT\""

          if echo "$HEAD_COMMIT" | grep -qP "(?i)\b(trace)\b\s*:"; then
            echo "[DEBUG] Found skipped token (trace) in HEAD commit message. Exiting step."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[DEBUG] HEAD commit cleared (no skip tokens found)."

          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1) 
          echo "[DEBUG] Evaluated LAST RELEASE TAG: \"$LAST_TAG\""

          if [ -z "$LAST_TAG" ]; then
            echo "[DEBUG] No previous version tag matching 'v*' was found. First Release Scenario Triggered."
            echo "version=0.0.100" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[DEBUG] Fetching commits between $LAST_TAG and HEAD..."
          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:%s) 
          PREV_VERSION=${LAST_TAG#v} 
          VERSION=$PREV_VERSION
          
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2) 
          PATCH=$(echo "$VERSION" | cut -d. -f3) 
          
          echo "[DEBUG] Extracted values from previous version ($VERSION):"
          echo "        MAJOR: $MAJOR"
          echo "        MINOR: $MINOR"
          echo "        PATCH: $PATCH"
          echo "[DEBUG] Commits to parse:"
          echo "$COMMITS"

          PATCH=$((PATCH + 1))
          # 2. Check for major breaking changes
          if echo "$COMMITS" | grep -qP "(?i)\bbreak\b\s*:"; then
            echo "[DEBUG] Match found for: break token. Incrementing MAJOR version."
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          # 3. Check for new features
          elif echo "$COMMITS" | grep -qP "(?i)\bfeat\b\s*:"; then
            echo "[DEBUG] Match found for: feat token. Incrementing MINOR version."
            MINOR=$((MINOR + 1))
            PATCH=0

          # 4. Check for bug fixes
          elif echo "$COMMITS" | grep -qP "(?i)\bfix\b\s*:"; then
            echo "[DEBUG] Match found for: fix token. Incrementing PATCH version."
            PATCH=$((PATCH + 1))

          # 5. Fallback if no valid token was found anywhere
          else
            echo "[DEBUG] Error: Code path reached baseline fallback. No fix:, break:, or feat: commits discovered in the collection."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Error: This is not a release... there are no fix:, break:, or feat: commits!"
            exit 0
          fi
          
          echo "[DEBUG] Building Next Version string..."
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          
          echo "[DEBUG] Current Release Version: $VERSION"
          echo "[DEBUG] Calculated Target Version: $NEW_VERSION"

          echo "previous_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "[DEBUG] All output parameters appended safely to GITHUB_OUTPUT. Script complete."


      - name: Setup .NET 10 SDK
        if: steps.get_version.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Discover Projects
        if: steps.get_version.outputs.release == 'true'
        id: project_discovery
        run: |
          allProjects="$(find "$GITHUB_WORKSPACE/src/Setup" -mindepth 2 -maxdepth 2 -name '*.csproj' | sort)"
          projectVersions=""
          projectVersionToRelease=""
          projectCommits=""

          # Use the single global version from the previous step
          version="${{ steps.get_version.outputs.version }}"

          for csproj in $allProjects; do
            name="$(basename "$csproj" .csproj)"
            project_dir="$(dirname "$csproj")"
            
            echo "Processing project: $name ($version)"
            projectVersions+="${csproj};${version};${name} "

            # 1. Find the latest existing tag matching this project's pattern
            latest_tag=$(git tag -l "registry-*" | sort -V | tail -n 1)

            if [ -n "$latest_tag" ]; then
              echo "  Found last tag: $latest_tag"
              
              # 2. Extract commit IDs affecting this folder since the tag
              affected_commits=$(git log --pretty=format:%H "$latest_tag"..HEAD -- "$project_dir" | tr '\n' ',' | sed 's/,$//')

              if [ -n "$affected_commits" ]; then
                echo "  -> Changes detected. Commits: $affected_commits"
                projectVersionToRelease+="${csproj};${version};${name} "
                projectCommits+="${name}:${affected_commits} "
              else
                echo "  -> No changes detected in $project_dir. Skipping release."
              fi
            else
              # 3. Fallback: If no tag exists at all, grab all historical commits for this folder
              echo "  -> No previous tag found for ${name}. Aggregating history."
              affected_commits=$(git log --pretty=format:%H HEAD -- "$project_dir" | tr '\n' ',' | sed 's/,$//')
              
              if [ -z "$affected_commits" ]; then
                affected_commits=$(git rev-parse HEAD)
              fi
              
              projectVersionToRelease+="${csproj};${version};${name} "
              projectCommits+="${name}:${affected_commits} "
            fi
          done

          # Strip trailing spaces and save everything to outputs
          echo "projectVersionToRelease=${projectVersionToRelease% }" >> $GITHUB_OUTPUT
          echo "projectVersions=${projectVersions% }" >> $GITHUB_OUTPUT
          echo "allProjects=${allProjects}" >> $GITHUB_OUTPUT
          echo "projectCommits=${projectCommits% }" >> $GITHUB_OUTPUT

      - name: Generate Registry Release Notes
        if: steps.get_version.outputs.release == 'true'
        id: generate_release_notes
        run: |
          # HEAVILY AI GENERATED
          set -eu
          LAST_VERSION="${{ steps.get_version.outputs.previous_version }}"
          NEXT_VERSION="${{ steps.get_version.outputs.version }}"
          PROJECT_COMMITS_MAP="${{ steps.project_discovery.outputs.projectCommits }}"

          # 1. Parse out all commit SHAs assigned to console projects safely using POSIX utilities
          # Converts spaces to newlines, extracts after the colon, converts commas to newlines, filters empty lines
          CONSOLE_SHAS=$(echo "$PROJECT_COMMITS_MAP" | tr ' ' '\n' | cut -d':' -f2- | tr ',' '\n' | grep -v '^$' || true)

          # [DEBUG LOGS] Check inputs from discovery step
          echo "=== [DEBUG] REGISTRY RELEASE NOTES INPUTS ==="
          echo "LAST_VERSION: $LAST_VERSION"
          echo "NEXT_VERSION: $NEXT_VERSION"
          echo "Excluded Console SHAs:"
          echo "$CONSOLE_SHAS"
          echo "============================================="

          # 2. Grab ALL commits first, printing the hash followed by the content (%H %B or %H %s)
          ALL_RAW_LOGS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:"COMMIT_SHA:%H%n%B" || true)
          ALL_SUBJECTS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:"%H %s" || true)

          # 3. Filter out lines using POSIX grep if console SHAs exist
          if [ -n "$CONSOLE_SHAS" ]; then
            # Filter subjects by excluding any lines starting with the console hashes
            COMMITS=$(echo "$ALL_SUBJECTS" | grep -Fv "$CONSOLE_SHAS" | cut -d' ' -f2- || true)
            
            # For full bodies, convert to a single-line tracker format temporarily to filter safely
            # We filter out the exact block matching the console SHAs using a loop or by matching commit tracking lines
            RAW_LOGS=""
            current_commit_valid=1
            
            # Read line by line over the raw logs to properly strip blocks tied to excluded SHAs
            echo "$ALL_RAW_LOGS" | while IFS= read -r line; do
              case "$line" in
                COMMIT_SHA:*)
                  sha=$(echo "$line" | cut -d':' -f2)
                  current_commit_valid=1
                  # Check if this SHA is in our console list
                  if echo "$CONSOLE_SHAS" | grep -q "$sha"; then
                    current_commit_valid=0
                  fi
                  ;;
                *)
                  if [ "$current_commit_valid" -eq 1 ]; then
                    echo "$line"
                  fi
                  ;;
              esac
            done > /tmp/filtered_raw_logs.txt
            RAW_LOGS=$(cat /tmp/filtered_raw_logs.txt)
          else
            COMMITS=$(echo "$ALL_SUBJECTS" | cut -d' ' -f2- || true)
            RAW_LOGS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B || true)
          fi

          # [DEBUG LOGS] View what registry logs actually remain after filtration
          echo "=== [DEBUG] CAPTURED COMMITS ==="
          echo "Registry-Only Commit Subjects:"
          echo "$COMMITS"
          echo "================================="

          mkdir -p /tmp/artifacts/output
          RELEASE_NOTES_FILE="/tmp/artifacts/output/release_notes.md"
          true > "$RELEASE_NOTES_FILE" 

          # 4. Extract Breaking Changes from the FILTERED logs
          BREAKS=$(echo "$RAW_LOGS" | grep -Ei '^break:' | sed 's/^[Bb][Rr][Ee][Aa][Kk]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$BREAKS" ]; then
            echo "## BREAKING CHANGES" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$BREAKS" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 5. Extract Features from the FILTERED logs
          FEATS=$(echo "$RAW_LOGS" | grep -Ei '^feat:' | sed 's/^[Ff][Ee][Aa][Tt]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FEATS" ]; then
            echo "## New Features" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$FEATS" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 6. Extract Fixes from the FILTERED logs
          FIXES=$(echo "$RAW_LOGS" | grep -Ei '^fix:' | sed 's/^[Ff][Ii][Xx]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FIXES" ]; then
            echo "## Fixes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$FIXES" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # 7. Extract Notes from the FILTERED logs
          NOTES=$(echo "$RAW_LOGS" | grep -Ei '^note:' | sed 's/^[Nn][Oo][Tt][Ee]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$NOTES" ]; then
            echo "## Notes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n" "$NOTES" >> "$RELEASE_NOTES_FILE"
            echo "" >> "$RELEASE_NOTES_FILE"
          fi

          # [DEBUG LOGS] Print out the final file contents
          echo "=== [DEBUG] GENERATED REGISTRY RELEASE NOTES ==="
          cat "$RELEASE_NOTES_FILE"
          echo "================================================"

          echo "notes_file=$RELEASE_NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate Console Release Notes
        if: steps.get_version.outputs.release == 'true'
        id: generate_console_release_notes
        run: |
          # HEAVILY AI GENERATED
          set -eu
          OUTPUT_DIR="/tmp/artifacts/output"
          mkdir -p "$OUTPUT_DIR"

          PROJECTS_TO_RELEASE="${{ steps.project_discovery.outputs.projectVersionToRelease }}"
          PROJECT_COMMITS_MAP="${{ steps.project_discovery.outputs.projectCommits }}"

          echo "=== [DEBUG] CONSOLE RELEASES INPUTS ==="
          echo "PROJECTS_TO_RELEASE: $PROJECTS_TO_RELEASE"
          echo "PROJECT_COMMITS_MAP: $PROJECT_COMMITS_MAP"
          echo "======================================="

          for project in $PROJECTS_TO_RELEASE; do
            p_name=$(echo "$project" | cut -d';' -f3)
            p_version=$(echo "$project" | cut -d';' -f2)

            RELEASE_NOTES_FILE="$OUTPUT_DIR/${p_name}.md"
            echo "# Release Notes for $p_name ($p_version)" > "$RELEASE_NOTES_FILE"

            p_match=""
            for entry in $PROJECT_COMMITS_MAP; do
              case "$entry" in
                "$p_name":*) p_match="$entry" ; break ;;
              esac
            done

            if [ -z "$p_match" ]; then
              echo "  [DEBUG] No commits found matching project: $p_name"
              continue
            fi
            
            raw_shas=$(echo "$p_match" | cut -d':' -f2)
            commit_pool=$(echo "$raw_shas" | tr ',' ' ')

            echo "  [DEBUG] Processing $p_name with commits: $commit_pool"

            breaks=""
            feats=""
            fixes=""
            notes=""
            commits=""

            for sha in $commit_pool; do
              [ -z "$sha" ] && continue
              
              commit_body=$(git log -1 --pretty=format:%B "$sha")
              commit_subject=$(git log -1 --pretty=format:%s "$sha")

              c_break=$(echo "$commit_body" | grep -Ei '^break:' | sed 's/^[Bb][Rr][Ee][Aa][Kk]:[[:space:]]*//' | sed 's/^/- /' || true)
              c_feat=$(echo "$commit_body" | grep -Ei '^feat:' | sed 's/^[Ff][Ee][Aa][Tt]:[[:space:]]*//' | sed 's/^/- /' || true)
              c_fix=$(echo "$commit_body" | grep -Ei '^fix:' | sed 's/^[Ff][Ii][Xx]:[[:space:]]*//' | sed 's/^/- /' || true)
              c_note=$(echo "$commit_body" | grep -Ei '^note:' | sed 's/^[Nn][Oo][Tt][Ee]:[[:space:]]*//' | sed 's/^/- /' || true)

              matched=0

              if [ -n "$c_break" ]; then
                breaks="${breaks}$(printf "%s\n" "$c_break")"
                matched=1
              fi
              if [ -n "$c_feat" ]; then
                feats="${feats}$(printf "%s\n" "$c_feat")"
                matched=1
              fi
              if [ -n "$c_fix" ]; then
                fixes="${fixes}$(printf "%s\n" "$c_fix")"
                matched=1
              fi
              if [ -n "$c_note" ]; then
                notes="${notes}$(printf "%s\n" "$c_note")"
                matched=1
              fi

              if [ "$matched" -eq 0 ] && [ -n "$commit_subject" ]; then
                commits="${commits}$(printf "- %s\n" "$commit_subject")"
              fi
            done

            if [ -n "$breaks" ]; then
              echo "" >> "$RELEASE_NOTES_FILE"
              echo "## BREAKING CHANGES" >> "$RELEASE_NOTES_FILE"
              printf "%s" "$breaks" >> "$RELEASE_NOTES_FILE"
            fi

            if [ -n "$feats" ]; then
              echo "" >> "$RELEASE_NOTES_FILE"
              echo "## New Features" >> "$RELEASE_NOTES_FILE"
              printf "%s" "$feats" >> "$RELEASE_NOTES_FILE"
            fi

            if [ -n "$fixes" ]; then
              echo "" >> "$RELEASE_NOTES_FILE"
              echo "## Fixes" >> "$RELEASE_NOTES_FILE"
              printf "%s" "$fixes" >> "$RELEASE_NOTES_FILE"
            fi

            if [ -n "$notes" ]; then
              echo "" >> "$RELEASE_NOTES_FILE"
              echo "## Notes" >> "$RELEASE_NOTES_FILE"
              printf "%s" "$notes" >> "$RELEASE_NOTES_FILE"
            fi

            if [ -n "$commits" ]; then
              echo "" >> "$RELEASE_NOTES_FILE"
              echo "## Commits" >> "$RELEASE_NOTES_FILE"
              printf "%s" "$commits" >> "$RELEASE_NOTES_FILE"
            fi
            
            echo "Successfully generated: $RELEASE_NOTES_FILE"

            echo "=== [DEBUG] CONTENTS FOR $p_name ==="
            cat "$RELEASE_NOTES_FILE"
            echo "====================================="
          done

          echo "output_directory=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Merge Project Release Notes
        if: steps.get_version.outputs.release == 'true'
        id: merge_release_notes
        run: |
          # HEAVILY AI GENERATED
          set -eu
          OUTPUT_DIR="/tmp/artifacts/output"
          MAIN_NOTES="$OUTPUT_DIR/release_notes.md"
          CAT_DIR="/tmp/categories"

          echo "=== [DEBUG] INITIAL MAIN RELEASE NOTES ==="
          if [ -f "$MAIN_NOTES" ]; then cat "$MAIN_NOTES"; else echo "(File does not exist yet)"; fi
          echo "=========================================="

          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$CAT_DIR"

          # 1. Back up any existing global release notes content into our category tracking blocks
          if [ -f "$MAIN_NOTES" ] && [ -s "$MAIN_NOTES" ]; then
            current_cat=""
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                "## BREAKING CHANGES"*) current_cat="BREAKING_CHANGES" ;;
                "## New Features"*)     current_cat="New_Features" ;;
                "## Fixes"*)            current_cat="Fixes" ;;
                "## Notes"*)            current_cat="Notes" ;;
                "## "*)                 current_cat="" ;; # Ignore unknown root sections
                *)
                  if [ -n "$current_cat" ] && [ -n "$line" ]; then
                    printf "%s\n" "$line" >> "$CAT_DIR/$current_cat.global"
                  fi
                  ;;
              esac
            done < "$MAIN_NOTES"
          fi

          NL='
          '

          # 2. Parse all project markdown files and sort contents into their category files
          for project_file in "$OUTPUT_DIR"/*.md; do
            [ ! -f "$project_file" ] && continue
            filename=$(basename "$project_file")
            [ "$filename" = "release_notes.md" ] && continue

            p_name="${filename%.md}"
            echo "Processing project file: $filename -> Project: $p_name"

            current_section=""
            section_content=""

            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                "## "*) 
                  if [ -n "$current_section" ] && [ -n "$section_content" ]; then
                    section_content=$(printf "%s" "$section_content" | sed '/^$/d')
                    if [ -n "$section_content" ]; then
                      printf "### %s %s\n%s\n\n" "$p_name" "$current_section" "$section_content" >> "$CAT_DIR/$current_section.projects"
                    fi
                  fi
                  # Normalize section names to match folder structures cleanly 
                  raw_sec=$(echo "$line" | sed 's/^## //')
                  case "$raw_sec" in
                    "BREAKING CHANGES"*) current_section="BREAKING_CHANGES" ;;
                    "New Features"*)     current_section="New_Features" ;;
                    "Fixes"*)            current_section="Fixes" ;;
                    "Notes"*)            current_section="Notes" ;;
                    *)                   current_section="" ;;
                  esac
                  section_content=""
                  ;;
                "#"*)
                  ;;
                *)
                  if [ -n "$current_section" ]; then
                    section_content="${section_content}${line}${NL}"
                  fi
                  ;;
              esac
            done < "$project_file"

            # Flush final lingering section block inside file loop
            if [ -n "$current_section" ] && [ -n "$section_content" ]; then
              section_content=$(printf "%s" "$section_content" | sed '/^$/d')
              if [ -n "$section_content" ]; then
                printf "### %s %s\n%s\n\n" "$p_name" "$current_section" "$section_content" >> "$CAT_DIR/$current_section.projects"
              fi
            fi
          done

          # 3. Rebuild the main release_notes.md file in the STRICT MANDATORY ORDER
          true > "$MAIN_NOTES"

          # Order Token Sequence: BREAKING_CHANGES -> New_Features -> Fixes -> Notes
          for cat_type in BREAKING_CHANGES New_Features Fixes Notes; do
            # Format headers gracefully back to standard titles
            case "$cat_type" in
              BREAKING_CHANGES) title="BREAKING CHANGES" ;;
              New_Features)     title="New Features" ;;
              Fixes)            title="Fixes" ;;
              Notes)            title="Notes" ;;
            )

            # Check if there is any global or project data for this section
            if [ -f "$CAT_DIR/$cat_type.global" ] || [ -f "$CAT_DIR/$cat_type.projects" ]; then
              printf "## %s\n" "$title" >> "$MAIN_NOTES"
              
              # Append original general notes first if they exist
              if [ -f "$CAT_DIR/$cat_type.global" ]; then
                cat "$CAT_DIR/$cat_type.global" >> "$MAIN_NOTES"
                printf "\n" >> "$MAIN_NOTES"
              fi

              # Append project-specific breakdown summaries second
              if [ -f "$CAT_DIR/$cat_type.projects" ]; then
                cat "$CAT_DIR/$cat_type.projects" >> "$MAIN_NOTES"
              fi
            fi
          done

          # 4. Final sanitization pass to normalize file spacing layout safely
          awk '
            /./ { WAS_EMPTY=0; print; next }
            !WAS_EMPTY { WAS_EMPTY=1; print "" }
          ' "$MAIN_NOTES" | sed '/./,/^$/!d' > "$MAIN_NOTES.tmp" && mv "$MAIN_NOTES.tmp" "$MAIN_NOTES"

          echo "=== [DEBUG] FINAL SORTED MERGED RELEASE NOTES ==="
          cat "$MAIN_NOTES"
          echo "=========================================="

          # Clean up our temporary working directory contents safely
          rm -rf "$CAT_DIR"




      - name: Publish Projects
        if: steps.get_version.outputs.release == 'true'
        run: |
          allProjects="$(find "$GITHUB_WORKSPACE/src/Setup" -mindepth 2 -maxdepth 2 -name '*.csproj' | sort)"
          for csproj in $allProjects; do
            dotnet publish "$csproj" -c Release -r linux-x64 --self-contained true 
          done
          echo "allProjects=${allProjects[*]}" >> $GITHUB_OUTPUT

      - name: Validating Consoles
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          allProjects="${{ steps.project_discovery.outputs.allProjects }}"
          if [ -z "$allProjects" ]; then
            echo "::error::NO PROJECTS FOUND"
            exit 1
          fi
          for csproj in $allProjects; do
            root="$(dirname "$csproj")"

            [ -f "$root/assets/server_banner.jpg" ] || {
              echo "::error::/assets/server_banner.jpg must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/game_info.json" ] || {
              echo "::error::/config/game_info.json must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/manifest.json" ] || {
              echo "::error::/config/manifest.json must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/dependencies.json" ] || {
              echo "::error::/config/dependencies.json must be present for $csproj"
              exit 1
            }
          done
