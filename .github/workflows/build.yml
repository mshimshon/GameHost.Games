name: Build

on:
  push:
    # branches:
    #   - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags

      - name: Calculate Version
        id: get_version
        run: |
          set -eu
          echo "[DEBUG] Starting Calculate Version script..."

          # 1. Instantly fail if not inside a valid Git repository clone
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This directory is not a Git repository. Did you forget actions/checkout?"
            exit 1
          fi
          echo "[DEBUG] Confirmed inside a valid Git repository work tree."

          HEAD_COMMIT=$(git log -1 --pretty=format:%s)
          echo "[DEBUG] HEAD_COMMIT: \"$HEAD_COMMIT\""

          if echo "$HEAD_COMMIT" | grep -qP "(?i)\b(trace)\b\s*:"; then
            echo "[DEBUG] Found skipped token (trace) in HEAD commit message. Exiting step."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[DEBUG] HEAD commit cleared (no skip tokens found)."

          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1) 
          echo "[DEBUG] Evaluated LAST RELEASE TAG: \"$LAST_TAG\""

          if [ -z "$LAST_TAG" ]; then
            echo "[DEBUG] No previous version tag matching 'v*' was found. First Release Scenario Triggered."
            echo "version=0.0.100" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[DEBUG] Fetching commits between $LAST_TAG and HEAD..."
          COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:%s) 
          PREV_VERSION=${LAST_TAG#v} 
          VERSION=$PREV_VERSION
          
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2) 
          PATCH=$(echo "$VERSION" | cut -d. -f3) 
          
          echo "[DEBUG] Extracted values from previous version ($VERSION):"
          echo "        MAJOR: $MAJOR"
          echo "        MINOR: $MINOR"
          echo "        PATCH: $PATCH"
          echo "[DEBUG] Commits to parse:"
          echo "$COMMITS"

          PATCH=$((PATCH + 1))
          # 2. Check for major breaking changes
          if echo "$COMMITS" | grep -qP "(?i)\bbreak\b\s*:"; then
            echo "[DEBUG] Match found for: break token. Incrementing MAJOR version."
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          # 3. Check for new features
          elif echo "$COMMITS" | grep -qP "(?i)\bfeat\b\s*:"; then
            echo "[DEBUG] Match found for: feat token. Incrementing MINOR version."
            MINOR=$((MINOR + 1))
            PATCH=0

          # 4. Check for bug fixes
          elif echo "$COMMITS" | grep -qP "(?i)\bfix\b\s*:"; then
            echo "[DEBUG] Match found for: fix token. Incrementing PATCH version."
            PATCH=$((PATCH + 1))

          # 5. Fallback if no valid token was found anywhere
          else
            echo "[DEBUG] Error: Code path reached baseline fallback. No fix:, break:, or feat: commits discovered in the collection."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Error: This is not a release... there are no fix:, break:, or feat: commits!"
            exit 0
          fi
          
          echo "[DEBUG] Building Next Version string..."
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          
          echo "[DEBUG] Current Release Version: $VERSION"
          echo "[DEBUG] Calculated Target Version: $NEW_VERSION"

          echo "previous_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "[DEBUG] All output parameters appended safely to GITHUB_OUTPUT. Script complete."


      - name: Setup .NET 10 SDK
        if: steps.get_version.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Discover Projects
        if: steps.get_version.outputs.release == 'true'
        id: project_discovery
        run: |
          allProjects="$(find "$GITHUB_WORKSPACE/src/Setup" -mindepth 2 -maxdepth 2 -name '*.csproj' | sort)"
          projectVersions=""
          projectVersionToRelease=""
          projectCommits=""

          version="${{ steps.get_version.outputs.version }}"
          
          latest_tag=$(git tag -l "registry-*" | sort -V | tail -n 1)

          while IFS= read -r csproj; do
            [ -z "$csproj" ] && continue
            name="$(basename "$csproj" .csproj)"
            project_dir="$(dirname "$csproj")"
            
            echo "Processing project: $name ($version)"
            projectVersions+="${csproj};${version};${name} "

            if [ -n "$latest_tag" ]; then
              echo "  Found last tag: $latest_tag"
              affected_commits=$(git log --pretty=format:%H "$latest_tag"..HEAD -- "$project_dir" | tr '\n' ',' | sed 's/,$//')

              if [ -n "$affected_commits" ]; then
                echo "  -> Changes detected. Commits: $affected_commits"
                projectVersionToRelease+="${csproj};${version};${name} "
                projectCommits+="${name}:${affected_commits} "
              else
                echo "  -> No changes detected in $project_dir. Skipping release."
              fi
            else
              echo "  -> No previous tag found for ${name}. Aggregating history."
              affected_commits=$(git log --pretty=format:%H HEAD -- "$project_dir" | tr '\n' ',' | sed 's/,$//')
              
              if [ -z "$affected_commits" ]; then
                affected_commits=$(git rev-parse HEAD)
              fi
              
              projectVersionToRelease+="${csproj};${version};${name} "
              projectCommits+="${name}:${affected_commits} "
            fi
          done <<< "$allProjects"

          # [DEBUG LOGS] Print variables before saving to output
          echo "=== [DEBUG] PROJECT DISCOVERY OUTPUTS ==="
          echo "projectVersionToRelease: ${projectVersionToRelease% }"
          echo "projectVersions: ${projectVersions% }"
          echo "projectCommits: ${projectCommits% }"
          echo "allProjects:"
          echo "$allProjects"
          echo "========================================="

          # Save to outputs
          echo "projectVersionToRelease=${projectVersionToRelease% }" >> $GITHUB_OUTPUT
          echo "projectVersions=${projectVersions% }" >> $GITHUB_OUTPUT
          echo "projectCommits=${projectCommits% }" >> $GITHUB_OUTPUT
          
          echo "allProjects<<EOF" >> $GITHUB_OUTPUT
          echo "$allProjects" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Registry Release Notes
        if: steps.get_version.outputs.release == 'true'
        id: generate_release_notes
        run: |
          set -eu
          LAST_VERSION="${{ steps.get_version.outputs.previous_version }}"
          
          mkdir -p /tmp/artifacts/output
          RELEASE_NOTES_FILE="/tmp/artifacts/output/release_notes.md"
          true > "$RELEASE_NOTES_FILE"

          RAW_LOGS=$(git log "v$LAST_VERSION"..HEAD --pretty=format:%B)

          # 1. Extract Breaking Changes
          BREAKS=$(echo "$RAW_LOGS" | grep -Ei '^break:' | sed 's/^[Bb][Rr][Ee][Aa][Kk]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$BREAKS" ]; then
            echo "## BREAKING CHANGES" >> "$RELEASE_NOTES_FILE"
            printf "%s\n\n" "$BREAKS" >> "$RELEASE_NOTES_FILE"
          fi

          # 2. Extract Features
          FEATS=$(echo "$RAW_LOGS" | grep -Ei '^feat:' | sed 's/^[Ff][Ee][Aa][Tt]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FEATS" ]; then
            echo "## New Features" >> "$RELEASE_NOTES_FILE"
            printf "%s\n\n" "$FEATS" >> "$RELEASE_NOTES_FILE"
          fi

          # 3. Extract Fixes
          FIXES=$(echo "$RAW_LOGS" | grep -Ei '^fix:' | sed 's/^[Ff][Ii][Xx]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$FIXES" ]; then
            echo "## Fixes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n\n" "$FIXES" >> "$RELEASE_NOTES_FILE"
          fi

          # 4. Extract Notes
          NOTES=$(echo "$RAW_LOGS" | grep -Ei '^note:' | sed 's/^[Nn][Oo][Tt][Ee]:[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -n "$NOTES" ]; then
            echo "## Notes" >> "$RELEASE_NOTES_FILE"
            printf "%s\n\n" "$NOTES" >> "$RELEASE_NOTES_FILE"
          fi

          # [DEBUG LOGS] Print generated release notes
          echo "=== [DEBUG] GENERATED RELEASE NOTES ==="
          cat "$RELEASE_NOTES_FILE"
          echo "======================================="

          echo "notes_file=$RELEASE_NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish Projects
        if: steps.get_version.outputs.release == 'true'
        run: |
          allProjects="$(find "$GITHUB_WORKSPACE/src/Setup" -mindepth 2 -maxdepth 2 -name '*.csproj' | sort)"
          for csproj in $allProjects; do
            dotnet publish "$csproj" -c Release -r linux-x64 --self-contained true 
          done
          echo "allProjects=${allProjects[*]}" >> $GITHUB_OUTPUT

      - name: Validating Consoles
        if: steps.get_version.outputs.release == 'true'
        run: |
          set -eu
          allProjects="${{ steps.project_discovery.outputs.allProjects }}"
          if [ -z "$allProjects" ]; then
            echo "::error::NO PROJECTS FOUND"
            exit 1
          fi
          for csproj in $allProjects; do
            root="$(dirname "$csproj")"

            [ -f "$root/assets/server_banner.jpg" ] || {
              echo "::error::/assets/server_banner.jpg must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/game_info.json" ] || {
              echo "::error::/config/game_info.json must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/manifest.json" ] || {
              echo "::error::/config/manifest.json must be present for $csproj"
              exit 1
            }

            [ -f "$root/config/dependencies.json" ] || {
              echo "::error::/config/dependencies.json must be present for $csproj"
              exit 1
            }
          done
